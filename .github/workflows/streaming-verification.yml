name: Streaming verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check:backend
      - run: npm test
      - run: npm run build
      - name: Verify background notifications in Chrome
        run: CHROMIUM_BIN=google-chrome timeout 50s node scripts/check-background-push.mjs
